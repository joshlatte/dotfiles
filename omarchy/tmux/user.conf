# ~/.config/tmux/user.conf
# Personal overrides layered on top of Omarchy's tmux.conf.
# Sourced from the last line of ~/.config/tmux/tmux.conf.
#
# Keybindings ONLY. No status/theme/terminal-overrides settings live here, so
# `omarchy theme set` keeps full control of colors.

# --- Vim-aware pane navigation -------------------------------------------
# Ctrl+h/j/k/l moves between panes, EXCEPT when the pane is running an editor,
# where the key is passed through so the editor's own split navigation works.
# Regex covers nvim/vim/view/gvim/vimdiff and helix.
# Omarchy's Ctrl+Alt+Arrow pane navigation is untouched and still works.
# Uses if-shell -F (a tmux format test) rather than shelling out to grep, so
# no subprocess is spawned on every keypress.

bind -N "Focus pane left"  -n C-h if-shell -F '#{m/ri:^(\S+/)?g?\.?(view|l?n?vim?x?|hx|helix)(diff)?$,#{pane_current_command}}' 'send-keys C-h' 'select-pane -L'
bind -N "Focus pane down"  -n C-j if-shell -F '#{m/ri:^(\S+/)?g?\.?(view|l?n?vim?x?|hx|helix)(diff)?$,#{pane_current_command}}' 'send-keys C-j' 'select-pane -D'
bind -N "Focus pane up"    -n C-k if-shell -F '#{m/ri:^(\S+/)?g?\.?(view|l?n?vim?x?|hx|helix)(diff)?$,#{pane_current_command}}' 'send-keys C-k' 'select-pane -U'
bind -N "Focus pane right" -n C-l if-shell -F '#{m/ri:^(\S+/)?g?\.?(view|l?n?vim?x?|hx|helix)(diff)?$,#{pane_current_command}}' 'send-keys C-l' 'select-pane -R'

# Optional: last-used pane on Ctrl+\. Uncomment to enable.
# bind -N "Focus last pane" -n 'C-\' if-shell -F '#{m/ri:^(\S+/)?g?\.?(view|l?n?vim?x?|hx|helix)(diff)?$,#{pane_current_command}}' 'send-keys C-\' 'select-pane -l'

# --- Clear screen ---------------------------------------------------------
# Plain Ctrl+L is now pane navigation, so clearing moves to the prefix.
#
# prefix + Ctrl+L  clears the visible screen only -- scrollback is kept, so
#                  prefix + [ can still page back through it. Safe default.
# prefix + Ctrl+K  also wipes the pane's scrollback via clear-history.
#                  DESTRUCTIVE and not undoable -- copy mode cannot recover it.
bind -N "Clear screen (keep scrollback)" C-l send-keys C-l
bind -N "Clear screen AND scrollback (destructive)" C-k send-keys C-l \; send-keys -R \; clear-history
